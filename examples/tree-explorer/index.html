<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>framesquared Basic CRUD App</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; padding: 16px; background: #f5f5f5; }
    .x-component { border: 1px solid #ddd; background: #fff; margin: 8px 0; }
    .x-panel { border-radius: 4px; overflow: hidden; }
    .x-panel-header { background: #1976d2; color: #fff; padding: 8px 12px; font-weight: 600; display: flex; align-items: center; }
    .x-panel-body { padding: 12px; }
    .x-btn { display: inline-block; padding: 6px 16px; background: #1976d2; color: #fff; border: none; border-radius: 4px; cursor: pointer; margin: 4px; font-size: 14px; }
    .x-btn:hover { background: #1565c0; }
    .x-btn-disabled { opacity: 0.5; cursor: not-allowed; }
    .x-field { margin: 8px 0; }
    .x-field-label { display: inline-block; width: 120px; font-weight: 500; }
    .x-field input { padding: 6px 8px; border: 1px solid #ccc; border-radius: 3px; font-size: 14px; width: 250px; }
    table { width: 100%; border-collapse: collapse; }
    th { background: #f5f5f5; text-align: left; padding: 8px; border-bottom: 2px solid #ddd; font-weight: 600; }
    td { padding: 8px; border-bottom: 1px solid #eee; }
    tr:hover td { background: #f0f7ff; }
    .x-grid-selected td { background: #bbdefb; }
  </style>
</head>
<body>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
