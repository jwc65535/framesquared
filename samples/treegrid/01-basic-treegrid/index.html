<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Basic TreeGrid — framesquared</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

      body {
        font-family: 'Inter', system-ui, sans-serif;
        background: linear-gradient(145deg, #e8f5e9 0%, #e3f2fd 50%, #ede7f6 100%);
        min-height: 100vh;
      }

      /* Lift the panel card off the gradient */
      .x-panel {
        box-shadow: 0 6px 32px rgba(26,35,126,0.12), 0 1px 6px rgba(0,0,0,0.07);
        border-radius: 14px;
        overflow: hidden;
        border: 1px solid rgba(26,35,126,0.09);
        margin: 40px auto;
        max-width: 880px;
      }

      /* Gradient header */
      .x-panel-header {
        background: linear-gradient(135deg, #1a237e 0%, #3949ab 100%);
        color: #fff;
        font-size: 15px;
        font-weight: 600;
        letter-spacing: 0.2px;
        border-bottom: none;
      }

      /* Folder rows: slightly bolder text */
      .x-treegrid-collapsed .x-treegrid-node-text,
      .x-treegrid-expanded  .x-treegrid-node-text {
        font-weight: 600;
        color: #1a237e;
      }
    </style>
  </head>
  <body>
    <script type="module" src="./src/app.ts"></script>
  </body>
</html>
