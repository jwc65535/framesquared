<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>User Status MVC — framesquared</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Fira+Code:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <style>
      /* ── Reset ──────────────────────────────────────────────────────────── */
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

      /* ── Page ───────────────────────────────────────────────────────────── */
      body {
        font-family: 'Inter', system-ui, sans-serif;
        background-color: #0f172a;
        background-image:
          radial-gradient(ellipse at 12% 12%, rgba(99, 102, 241, 0.22) 0%, transparent 52%),
          radial-gradient(ellipse at 88% 90%, rgba(16, 185, 129, 0.14) 0%, transparent 52%),
          radial-gradient(ellipse at 55% 50%, rgba(139, 92, 246, 0.08) 0%, transparent 60%);
        min-height: 100vh;
        padding: 44px 16px 72px;
      }

      #app {
        max-width: 680px;
        margin: 0 auto;
      }

      /* ── Page header ────────────────────────────────────────────────────── */
      #page-header {
        text-align: center;
        margin-bottom: 36px;
      }

      .pattern-badge {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        background: rgba(99, 102, 241, 0.14);
        color: #a5b4fc;
        border: 1px solid rgba(99, 102, 241, 0.28);
        border-radius: 100px;
        padding: 4px 14px;
        font-size: 10.5px;
        font-weight: 700;
        letter-spacing: 0.9px;
        text-transform: uppercase;
        margin-bottom: 18px;
      }

      #page-header h1 {
        font-size: 30px;
        font-weight: 700;
        color: #f1f5f9;
        letter-spacing: -0.5px;
        line-height: 1.2;
        margin-bottom: 12px;
      }

      #page-header p {
        font-size: 14px;
        color: #94a3b8;
        line-height: 1.65;
        max-width: 500px;
        margin: 0 auto;
      }

      #page-header code {
        background: rgba(99, 102, 241, 0.18);
        color: #c7d2fe;
        padding: 1px 6px;
        border-radius: 4px;
        font-family: 'Fira Code', ui-monospace, monospace;
        font-size: 12px;
      }

      /* ── Panel card ─────────────────────────────────────────────────────── */
      .x-panel {
        border-radius: 20px !important;
        border: none !important;
        box-shadow:
          0 0 0 1px rgba(255, 255, 255, 0.06),
          0 8px 24px rgba(0, 0, 0, 0.24),
          0 32px 64px rgba(0, 0, 0, 0.32) !important;
        overflow: hidden;
      }

      /* ── Panel header ───────────────────────────────────────────────────── */
      .x-panel-header {
        background: linear-gradient(135deg, #1e1b4b 0%, #312e81 55%, #3730a3 100%) !important;
        padding: 22px 24px !important;
        border-bottom: none !important;
      }

      .x-panel-header-text {
        font-size: 16px !important;
        font-weight: 700 !important;
        letter-spacing: -0.15px !important;
        color: #e0e7ff !important;
      }

      /* ── Panel body ─────────────────────────────────────────────────────── */
      .x-panel-body {
        padding: 0 !important;
        gap: 0 !important;
      }

      /* ── ListView table ─────────────────────────────────────────────────── */
      .x-listview { width: 100%; }

      .x-listview-table {
        width: 100%;
        border-collapse: collapse;
        font-size: 14px;
      }

      .x-listview-table thead th {
        text-align: left;
        padding: 11px 22px;
        font-size: 10px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.9px;
        color: #94a3b8;
        background: #f8fafc;
        border-bottom: 1px solid #e2e8f0;
        white-space: nowrap;
      }

      .x-listview-table .x-listview-row {
        cursor: pointer;
        transition: background 0.1s ease;
      }

      .x-listview-table .x-listview-row:hover:not(.x-selected) {
        background: #f8f9ff;
      }

      .x-listview-table .x-listview-row.x-selected {
        background: #eef2ff;
        box-shadow: inset 3px 0 0 #4f46e5;
      }

      .x-listview-table td {
        padding: 14px 22px;
        border-bottom: 1px solid #f1f5f9;
        color: #1e293b;
        vertical-align: middle;
        line-height: 1.4;
      }

      .x-listview-table .x-listview-row:last-child td { border-bottom: none; }

      /* First column: user name – slightly heavier */
      .x-listview-table td:first-child { font-weight: 500; color: #0f172a; }

      /* Department column: muted */
      .x-listview-table td:nth-child(2) { color: #64748b; font-size: 13px; }

      /* ── Status badge (set by controller via data-status attribute) ──────── */
      .x-listview-row[data-status="Active"] td:last-child,
      .x-listview-row[data-status="Inactive"] td:last-child {
        position: relative;
        padding-left: 32px;
        font-weight: 600;
        font-size: 12px;
        letter-spacing: 0.2px;
      }

      .x-listview-row[data-status="Active"] td:last-child::before,
      .x-listview-row[data-status="Inactive"] td:last-child::before {
        content: '';
        position: absolute;
        left: 18px;
        top: 50%;
        transform: translateY(-50%);
        width: 7px;
        height: 7px;
        border-radius: 50%;
      }

      .x-listview-row[data-status="Active"] td:last-child {
        color: #065f46;
      }

      .x-listview-row[data-status="Active"] td:last-child::before {
        background: #10b981;
        box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.2);
      }

      .x-listview-row[data-status="Inactive"] td:last-child {
        color: #94a3b8;
      }

      .x-listview-row[data-status="Inactive"] td:last-child::before {
        background: #cbd5e1;
      }

      /* ── Empty text ─────────────────────────────────────────────────────── */
      .x-listview-empty {
        padding: 40px 24px;
        text-align: center;
        color: #94a3b8;
        font-size: 13px;
        font-style: italic;
      }

      /* ── Bottom action bar ──────────────────────────────────────────────── */
      /* Toolbar lives in panel _items (not bbar) so lookupReference works.  */
      .user-action-bar.x-toolbar {
        background: #ffffff !important;
        border-top: 1px solid #e2e8f0 !important;
        border-bottom: none !important;
        padding: 0 !important;
      }

      /* Make container body fill the toolbar width so ToolbarFill pushes btn right */
      .user-action-bar .x-container-body {
        flex: 1 !important;
        min-width: 0;
        padding: 13px 22px !important;
        gap: 10px !important;
      }

      .user-action-bar .x-toolbar-text {
        font-size: 12.5px !important;
        color: #94a3b8 !important;
        font-style: italic !important;
        padding: 0 !important;
      }

      /* ── Button ─────────────────────────────────────────────────────────── */
      .x-btn {
        border-radius: 8px !important;
        padding: 8px 20px !important;
        font-size: 13px !important;
        font-weight: 600 !important;
        letter-spacing: 0.01em !important;
        transition: background 0.15s ease, box-shadow 0.15s ease, transform 0.1s ease !important;
        background: #4f46e5 !important;
      }

      .x-btn:not(.x-btn-disabled):not(:disabled):hover {
        background: #4338ca !important;
        box-shadow: 0 4px 14px rgba(79, 70, 229, 0.38) !important;
        transform: translateY(-1px);
      }

      .x-btn:not(.x-btn-disabled):not(:disabled):active {
        transform: translateY(0);
        box-shadow: none !important;
      }

      .x-btn.x-btn-disabled,
      .x-btn:disabled {
        background: #e2e8f0 !important;
        color: #94a3b8 !important;
        opacity: 1 !important;
        cursor: not-allowed;
        transform: none !important;
        box-shadow: none !important;
      }
    </style>
  </head>
  <body>
    <header id="page-header">
      <div class="pattern-badge">MVC Architecture</div>
      <h1>User Status Manager</h1>
      <p>
        Pure Model–View–Controller pattern using the framesquared
        <code>Controller</code> base class — events wired via
        <code>control()</code> and resolved with <code>lookupReference()</code>.
      </p>
    </header>

    <div id="app"></div>
    <script type="module" src="./src/app.ts"></script>
  </body>
</html>
