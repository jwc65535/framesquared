version: 2

updates:
  # npm / pnpm dependencies
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/New_York
    open-pull-requests-limit: 10
    reviewers: []
    labels:
      - dependencies
    commit-message:
      prefix: "deps"
      include: scope
    groups:
      # Group minor + patch updates for dev tooling into a single PR
      dev-tooling:
        dependency-type: development
        update-types:
          - minor
          - patch
        patterns:
          - "eslint*"
          - "@eslint/*"
          - "@typescript-eslint/*"
          - "typescript-eslint"
          - "prettier"
          - "husky"
          - "lint-staged"
          - "tsup"
          - "vitest"
          - "@vitest/*"
          - "jsdom"
      # Group TypeScript compiler updates
      typescript:
        patterns:
          - "typescript"

  # GitHub Actions
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/New_York
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - ci
    commit-message:
      prefix: "ci"
